name: Instagram · publicar peças aprovadas

# Roda quando uma peça aprovada (merge) chega em instagram/fila/ no ramo main.
on:
  push:
    branches: [main]
    paths: ["instagram/fila/**"]
  workflow_dispatch:
    inputs:
      so_verificar:
        description: "Só conferir a chave, sem publicar"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      # Sempre a versão mais recente de main: se dois merges chegam juntos, o segundo
      # não pode ver peças que o primeiro já publicou (isso causou posts repetidos em 20/10).
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Ferramentas para o vídeo do site (ffmpeg e Pillow)
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python3 -m pip install -q pillow || true
      - name: Publicar
        id: pub
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SO_VERIFICAR: ${{ inputs.so_verificar && '1' || '0' }}
        run: python3 scripts/instagram_publicar.py
      - name: Mover para publicados
        if: always()
        run: |
          if [ -n "$(git status --porcelain instagram/ data/videos.json videos/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A instagram/ data/videos.json videos/
            git commit -m "Instagram: registra peças publicadas"
            git pull --rebase origin main
            git push
          fi
