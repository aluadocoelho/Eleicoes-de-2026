name: Buscar checagens (Google Fact Check API)

on:
  schedule:
    - cron: "17 * * * *"   # de hora em hora, no minuto 17 (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar checagens
        env:
          GOOGLE_FACTCHECK_API_KEY: ${{ secrets.GOOGLE_FACTCHECK_API_KEY }}
        run: python scripts/fact_check_api.py
      - name: Gravar se houver novidade
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "Atualiza checagens da Fact Check API"
            git push
          else
            echo "Nada novo."
          fi
