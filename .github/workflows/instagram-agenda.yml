name: Instagram · publicar peças agendadas

# Peças aprovadas pelo dono com dia e hora marcados ficam em instagram/agendado/<AAAAMMDDHHMM>__<id>/
# (hora de Brasília). A cada 10 minutos, as que já passaram da hora vão para instagram/fila/ e são publicadas.
on:
  # O agendamento do GitHub atrasa ou pula execuções de 10 em 10 minutos; uma tarefa agendada da Clareia
  # dispara esta ação nos horários certos (9h, 15h e 18h). Estes horários ficam como reserva.
  schedule:
    - cron: "4,24,44 * * * *"
    - cron: "7 12,18,21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  agenda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Mover as peças que chegaram na hora
        id: mover
        run: |
          python3 - <<'PY'
          import os, shutil, datetime
          agora = (datetime.datetime.utcnow() - datetime.timedelta(hours=3)).strftime('%Y%m%d%H%M')
          base = 'instagram/agendado'; n = 0
          if os.path.isdir(base):
              for d in sorted(os.listdir(base)):
                  quando, _, pid = d.partition('__')
                  if pid and quando.isdigit() and quando <= agora and os.path.isdir(os.path.join(base, d)):
                      os.makedirs('instagram/fila', exist_ok=True)
                      shutil.move(os.path.join(base, d), os.path.join('instagram/fila', pid)); n += 1
                      print('na hora:', pid)
          open(os.environ['GITHUB_OUTPUT'], 'a').write(f'n={n}\n')
          PY
      - name: Gravar a mudança
        if: steps.mover.outputs.n != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A instagram/
          git commit -m "Instagram: peças agendadas chegaram na hora"
          for t in 1 2 3; do git push && break; git pull --rebase origin main; done
      - name: Ferramentas para o vídeo do site (ffmpeg e Pillow)
        if: steps.mover.outputs.n != '0'
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python3 -m pip install -q pillow || true
      - name: Publicar
        if: steps.mover.outputs.n != '0'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SO_VERIFICAR: "0"
        run: python3 scripts/instagram_publicar.py
      - name: Mover para publicados
        if: always() && steps.mover.outputs.n != '0'
        run: |
          if [ -n "$(git status --porcelain instagram/ data/videos.json videos/)" ]; then
            git add -A instagram/ data/videos.json videos/
            git commit -m "Instagram: registra peças publicadas"
            git pull --rebase origin main
            git push
          fi
