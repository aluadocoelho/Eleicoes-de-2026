name: Apuração (cópia dos dados do TSE)

# Reserva do bloco "Apuração ao vivo": o site lê o TSE direto do navegador;
# se o TSE não responder ao navegador, ele usa esta cópia (data/apuracao.json).
on:
  schedule:
    - cron: "*/5 * 25-26 10 *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: apuracao
  cancel-in-progress: false

jobs:
  copiar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Copiar o arquivo do TSE (por 5 minutos, a cada minuto)
        run: |
          agora=$(date -u +%Y%m%d%H%M)
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && { [ "$agora" -lt 202610251945 ] || [ "$agora" -gt 202610270300 ]; }; then echo "Fora da janela da apuração"; exit 0; fi
          # || [ "$agora" -gt 202610270300 ]; then echo "Fora da janela da apuração"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          URL="https://resultados.tse.jus.br/oficial/ele2026/6258/dados/br/br-c0001-e006258-u.json"
          for i in 1 2 3 4 5; do
            if curl -fsS -m 30 -A "ClareiaEleicoes/1.0 (+https://clareiaeleicoes.com.br)" "$URL" -o /tmp/apu.json && python3 -c "import json;d=json.load(open('/tmp/apu.json'));assert d.get('carg')"; then
              if ! cmp -s /tmp/apu.json data/apuracao.json; then
                cp /tmp/apu.json data/apuracao.json
                git add data/apuracao.json
                git commit -q -m "Apuração: cópia do TSE" || true
                for t in 1 2 3; do git push -q && break; git pull -q --rebase origin main; done
              fi
            else
              echo "TSE não respondeu"
            fi
            [ "$i" -lt 5 ] && sleep 55
          done
