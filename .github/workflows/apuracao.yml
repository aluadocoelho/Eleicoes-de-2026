name: Apuração (cópia dos dados do TSE)

# Reserva do bloco "Apuração ao vivo": o site lê o TSE direto do navegador;
# se o TSE não responder ao navegador, ele usa esta cópia (data/apuracao.json).
on:
  schedule:
    - cron: "*/5 * 25-26 10 *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: apuracao
  cancel-in-progress: false

jobs:
  copiar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Copiar o arquivo do TSE a cada minuto (5 min no agendamento, até 6 h quando disparado à mão)
        run: |
          set +e
          agora=$(date -u +%Y%m%d%H%M)
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && { [ "$agora" -lt 202610251945 ] || [ "$agora" -gt 202610270300 ]; }; then echo "Fora da janela da apuração"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          B="https://resultados.tse.jus.br/oficial/ele2026/6258/dados"
          A="ClareiaEleicoes/1.0 (+https://clareiaeleicoes.com.br)"
          N=5; [ "${{ github.event_name }}" = "workflow_dispatch" ] && N=360
          mkdir -p /tmp/novo/apuracao-uf
          for i in $(seq 1 $N); do
            ok=0
            if curl -fsS -m 30 -A "$A" "$B/br/br-c0001-e006258-u.json" -o /tmp/x.json && python3 -c "import json;assert json.load(open('/tmp/x.json')).get('carg')"; then cp /tmp/x.json /tmp/novo/apuracao.json; ok=1; else echo "TSE (br) não respondeu"; fi
            for uf in ac al ap am ba ce df es go ma mt ms mg pa pb pr pe pi rj rn rs ro rr sc sp se to; do
              if curl -fsS -m 20 -A "$A" "$B/$uf/$uf-c0001-e006258-u.json" -o /tmp/x.json && python3 -c "import json;assert json.load(open('/tmp/x.json')).get('carg')"; then cp /tmp/x.json /tmp/novo/apuracao-uf/$uf.json; ok=1; fi
            done
            if [ "$ok" = 1 ]; then
              for t in 1 2 3 4; do
                git fetch -q origin main && git checkout -q -B main origin/main || continue
                mkdir -p data/apuracao-uf
                [ -f /tmp/novo/apuracao.json ] && cp /tmp/novo/apuracao.json data/apuracao.json
                cp /tmp/novo/apuracao-uf/*.json data/apuracao-uf/ 2>/dev/null
                git add data/apuracao.json data/apuracao-uf
                git diff --cached --quiet && break
                git commit -q -m "Apuração: cópia do TSE" && git push -q origin main && break
                sleep 3
              done
            fi
            if [ "$i" -lt "$N" ]; then sleep 50; fi
          done
