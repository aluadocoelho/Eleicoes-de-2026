name: Validar dados

on:
  push:
    paths: ["data/**", "scripts/validate.py"]
  pull_request:
    paths: ["data/**", "scripts/validate.py"]
  workflow_dispatch: {}

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate.py
