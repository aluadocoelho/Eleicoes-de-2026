name: Vigia do site

# Abre o site como um visitante (celular e computador, pt/en/es) e avisa se algo quebrar.
# - Em cada mudança no site (push em main): testa a cópia do repositório antes de ela ir ao ar.
# - De hora em hora: testa o site no ar (clareiaeleicoes.com.br), inclusive se os dados estão atualizados.
# Se falhar, abre um aviso (issue) "Site com defeito" com o que quebrou; quando volta a passar, fecha o aviso.
on:
  push:
    branches: [main]
    paths: ["index.html", "en/**", "es/**", "site/**", "sw.js", "scripts/teste_site.py", ".github/workflows/vigia-site.yml"]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: vigia-site-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  vigiar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar o navegador de teste
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium
      - name: Testar
        id: teste
        continue-on-error: true
        env:
          SITE_LOCAL: ${{ github.event_name == 'push' && '.' || '' }}
        run: python scripts/teste_site.py
      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vigia-site
          path: teste-site/
          retention-days: 3
      - name: Abrir ou atualizar o aviso
        if: steps.teste.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          corpo="$(cat teste-site/resultado.md)

          Execução: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (capturas em Artifacts)"
          n=$(gh issue list --state open --label site-com-defeito --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$corpo"
          else
            gh label create site-com-defeito --color D62B2B --description "Aberto pela vigia do site" 2>/dev/null || true
            gh issue create --title "Site com defeito" --label site-com-defeito --body "$corpo"
          fi
          exit 1
      - name: Fechar o aviso quando voltar ao normal
        if: steps.teste.outcome == 'success' && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --state open --label site-com-defeito --json number --jq '.[].number'); do
            gh issue close "$n" --comment "A vigia do site voltou a passar em todos os testes."
          done
